name: Daily RevOps data refresh (SFDC → Sheet)

# Runs all Salesforce → Google Sheet pulls daily and on-demand.
on:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours (00,04,08,12,16,20 UTC) so the dashboard stays fresh.
                           # The data pulls are idempotent (overwrite tabs / today's dated column,
                           # never append), so running 6×/day is safe. The Slack digest is guarded
                           # below to post only once/day at 12:00 UTC (8pm Singapore).
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY_B64: ${{ secrets.GOOGLE_PRIVATE_KEY_B64 }}
      SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
      SF_API_VERSION: ${{ secrets.SF_API_VERSION }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DASH_API_URL: ${{ vars.DASH_API_URL }}
      CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: SF imports (Query 1/2 + LiveARR — replaces Coefficient)
        run: node scripts/refresh-sf-imports.mjs
      - name: ARR MoM (SFDC → Sheet)
        if: always()
        run: node scripts/refresh-arr-from-sfdc.mjs
      - name: Lead-conversion compliance
        if: always()
        run: node scripts/refresh-lead-conversion.mjs
      - name: Probability freshness
        if: always()
        run: node scripts/refresh-probability-freshness.mjs
      - name: Opps without a contact
        if: always()
        run: node scripts/refresh-opps-without-contact.mjs
      - name: AE annual attainment + potential
        if: always()
        run: node scripts/refresh-ae-annual-potential.mjs
      - name: Deal Tracker snapshot (replace)
        if: always()
        run: node scripts/build-deal-tracker.mjs
      - name: Sheet health check
        if: always()
        run: node scripts/check-sheet.mjs
      - name: Slack daily digest (what changed vs yesterday)
        if: always()
        # Data refreshes every 4 hours, but the digest is a once-a-day summary — post it
        # only on the 12:00 UTC run (8pm Singapore) so Slack isn't spammed 6×/day.
        run: |
          if [ "$(date -u +%H)" = "12" ]; then
            node scripts/daily-digest.mjs
          else
            echo "digest skipped — only posts on the 12:00 UTC run (current hour $(date -u +%H) UTC)"
          fi
