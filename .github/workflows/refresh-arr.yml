name: RevOps data refresh (SFDC → Sheet)

# Core ARR/pipeline data refreshes every ~2.5 hours so the dashboard stays near-live.
# The heavier weekly-cadence trackers + the Slack digest run ONCE a day (the 12:30 UTC
# slot) so the ops tabs don't churn and the channel isn't spammed.
on:
  schedule:
    - cron: "0 0,5,10,15,20 * * *"   # 00:00 05:00 10:00 15:00 20:00  (2.5h grid, on the hour)
    - cron: "30 2,7,17,22 * * *"     # 02:30 07:30 17:30 22:30        (2.5h grid, half past)
    - cron: "30 12 * * *"            # 12:30 — the once-a-day digest + ops-tracker run
  workflow_dispatch: {}               # manual run does the full set + digest

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY_B64: ${{ secrets.GOOGLE_PRIVATE_KEY_B64 }}
      SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
      SF_API_VERSION: ${{ secrets.SF_API_VERSION }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Prod dashboard origin the RevOps Pulse digest fetches its numbers from
      # (e.g. https://revops-dashboard.vercel.app). Set as a repo variable.
      DASH_API_URL: ${{ vars.DASH_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # ---- every 2.5h: core ARR / pipeline data ----
      - name: SF imports (Query 1/2 + LiveARR — replaces Coefficient)
        run: node scripts/refresh-sf-imports.mjs
      - name: ARR MoM (SFDC → Sheet)
        if: always()
        run: node scripts/refresh-arr-from-sfdc.mjs
      - name: Sheet health check
        if: always()
        run: node scripts/check-sheet.mjs

      # ---- once a day (12:30 UTC slot, or manual): ops trackers + digest ----
      - name: Lead-conversion compliance
        if: ${{ always() && (github.event.schedule == '30 12 * * *' || github.event_name == 'workflow_dispatch') }}
        run: node scripts/refresh-lead-conversion.mjs
      - name: Probability freshness
        if: ${{ always() && (github.event.schedule == '30 12 * * *' || github.event_name == 'workflow_dispatch') }}
        run: node scripts/refresh-probability-freshness.mjs
      - name: Opps without a contact
        if: ${{ always() && (github.event.schedule == '30 12 * * *' || github.event_name == 'workflow_dispatch') }}
        run: node scripts/refresh-opps-without-contact.mjs
      - name: AE annual attainment + potential
        if: ${{ always() && (github.event.schedule == '30 12 * * *' || github.event_name == 'workflow_dispatch') }}
        run: node scripts/refresh-ae-annual-potential.mjs
      - name: RevOps Pulse — daily digest to Slack
        if: ${{ always() && (github.event.schedule == '30 12 * * *' || github.event_name == 'workflow_dispatch') }}
        run: node scripts/post-revops-digest.mjs
